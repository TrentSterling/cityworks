<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Cityworks | Massing editor</title><link rel="stylesheet" href="style.css"></head>
<body><aside><header><h1>Cityworks</h1><span>Block massing</span></header>
<div class="row"><button id="undo">Undo</button><button id="redo">Redo</button></div>
